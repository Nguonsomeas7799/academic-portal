services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academic
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local or set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - academic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U academic -d academic']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  academic_pgdata:
